<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Депеша</title>
<style>
  :root{
    --bg:#F5F6FA;
    --sidebar-bg:#FFFFFF;
    --accent:#4C6EF5;
    --accent-dark:#3B5BDB;
    --accent-soft:#EEF1FF;
    --text:#1B1D27;
    --text-muted:#6B7280;
    --border:#E5E7EB;
    --bubble-in:#F1F2F6;
    --danger:#E03131;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .logo{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-weight:600;
    letter-spacing:0.2px;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    outline:none;
  }
  input, textarea{
    font-family:inherit;
    outline:none;
  }
  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#D7DAE2;border-radius:8px;}

  /* ---------- Auth screens ---------- */
  #auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-card{
    width:100%;
    max-width:380px;
    background:var(--sidebar-bg);
    border:1px solid var(--border);
    border-radius:18px;
    padding:36px 32px;
    box-shadow:0 1px 3px rgba(20,20,40,0.04);
  }
  .auth-card h1{
    font-size:28px;
    margin:0 0 4px 0;
  }
  .auth-card p.sub{
    color:var(--text-muted);
    margin:0 0 28px 0;
    font-size:14px;
    line-height:1.5;
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:14px;
    background:#FAFBFD;
  }
  .field input:focus{
    border-color:var(--accent);
    background:#fff;
  }
  .btn-primary{
    width:100%;
    padding:12px;
    background:var(--accent);
    color:#fff;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    margin-top:8px;
    transition:background .15s;
  }
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-primary:disabled{background:#C3CBE8;cursor:not-allowed;}
  .btn-link{
    background:none;
    color:var(--accent);
    font-size:13px;
    padding:0;
  }
  .btn-link:hover{text-decoration:underline;}
  .auth-links{
    display:flex;
    justify-content:space-between;
    margin-top:16px;
    font-size:13px;
  }
  .error-box{
    background:#FFF1F1;
    color:var(--danger);
    border:1px solid #FFD3D3;
    padding:9px 12px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:14px;
    line-height:1.4;
  }
  .info-box{
    background:var(--accent-soft);
    color:var(--accent-dark);
    border:1px solid #D6DEFF;
    padding:9px 12px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:14px;
    line-height:1.4;
  }

  /* ---------- App shell ---------- */
  #app-screen{
    display:none;
    height:100vh;
  }
  .app-shell{
    display:flex;
    height:100%;
  }
  .sidebar{
    width:340px;
    min-width:280px;
    background:var(--sidebar-bg);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
  }
  .sidebar-header{
    padding:18px 18px 12px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .sidebar-header .logo{font-size:20px;color:var(--text);}
  .me-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .avatar{
    width:34px;height:34px;border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:600;
    flex-shrink:0;
  }
  .avatar.lg{width:44px;height:44px;font-size:17px;}
  .icon-btn{
    background:none;
    width:32px;height:32px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);
  }
  .icon-btn:hover{background:var(--bubble-in);color:var(--text);}

  .search-wrap{padding:0 18px 12px 18px;}
  .search-input-row{
    display:flex;
    gap:6px;
  }
  .search-input-row input{
    flex:1;
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:9px;
    font-size:13.5px;
    background:#FAFBFD;
  }
  .search-input-row input:focus{border-color:var(--accent);background:#fff;}
  .search-btn{
    background:var(--accent);
    color:#fff;
    padding:0 14px;
    border-radius:9px;
    font-size:13px;
    font-weight:600;
  }
  .search-btn:hover{background:var(--accent-dark);}
  .search-result{
    margin:8px 0 4px 0;
    padding:10px 12px;
    background:var(--accent-soft);
    border-radius:10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .search-result .info{flex:1;min-width:0;}
  .search-result .name{font-size:13.5px;font-weight:600;}
  .search-result .mail{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mini-btn{
    background:var(--accent);
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding:7px 11px;
    border-radius:8px;
    white-space:nowrap;
  }
  .mini-btn:hover{background:var(--accent-dark);}
  .search-note{font-size:12px;color:var(--text-muted);padding:2px 2px 0 2px;}

  .chat-list{
    flex:1;
    overflow-y:auto;
    padding:4px 8px 12px 8px;
  }
  .chat-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 10px;
    border-radius:12px;
    cursor:pointer;
  }
  .chat-item:hover{background:var(--bubble-in);}
  .chat-item.active{background:var(--accent-soft);}
  .chat-item .info{flex:1;min-width:0;}
  .chat-item .top-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
  .chat-item .name{font-size:14px;font-weight:600;}
  .chat-item .time{font-size:11px;color:var(--text-muted);flex-shrink:0;}
  .chat-item .preview{font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .empty-list{
    padding:28px 20px;
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    line-height:1.6;
  }

  /* ---------- Chat area ---------- */
  .chat-area{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .chat-header{
    padding:14px 22px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--sidebar-bg);
  }
  .chat-header .name{font-size:15px;font-weight:600;}
  .chat-header .sub{font-size:12px;color:var(--text-muted);}

  .messages{
    flex:1;
    overflow-y:auto;
    padding:22px 6% 10px 6%;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .msg-row{
    display:flex;
    margin-bottom:6px;
  }
  .msg-row.out{justify-content:flex-end;}
  .msg-row.in{justify-content:flex-start;}
  .bubble{
    max-width:62%;
    padding:9px 13px;
    border-radius:16px;
    font-size:14px;
    line-height:1.42;
    position:relative;
  }
  .msg-row.out .bubble{
    background:var(--accent);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg-row.in .bubble{
    background:var(--bubble-in);
    color:var(--text);
    border-bottom-left-radius:4px;
  }
  .bubble .time{
    display:block;
    font-size:10.5px;
    margin-top:4px;
    opacity:0.7;
    text-align:right;
  }
  .bubble img{
    max-width:260px;
    max-height:260px;
    border-radius:10px;
    display:block;
    cursor:zoom-in;
  }
  .day-divider{
    align-self:center;
    background:var(--bubble-in);
    color:var(--text-muted);
    font-size:11.5px;
    padding:4px 12px;
    border-radius:20px;
    margin:14px 0;
  }

  .composer{
    padding:14px 22px 18px 22px;
    border-top:1px solid var(--border);
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--sidebar-bg);
  }
  .composer textarea{
    flex:1;
    resize:none;
    border:1px solid var(--border);
    border-radius:14px;
    padding:11px 14px;
    font-size:14px;
    max-height:120px;
    background:#FAFBFD;
    line-height:1.4;
  }
  .composer textarea:focus{border-color:var(--accent);background:#fff;}
  .composer .send-btn{
    background:var(--accent);
    color:#fff;
    width:40px;height:40px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .composer .send-btn:hover{background:var(--accent-dark);}
  .composer .attach-btn{
    width:40px;height:40px;
    border-radius:50%;
    background:var(--bubble-in);
    color:var(--text-muted);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .composer .attach-btn:hover{background:#E4E6EF;color:var(--text);}
  .img-preview-row{
    padding:0 22px;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .img-preview{
    position:relative;
    width:56px;height:56px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .img-preview img{width:100%;height:100%;object-fit:cover;}
  .img-preview .rm{
    position:absolute;top:2px;right:2px;
    width:18px;height:18px;
    background:rgba(0,0,0,0.55);
    color:#fff;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
  }

  .no-chat-selected{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    color:var(--text-muted);
    text-align:center;
    padding:20px;
  }
  .no-chat-selected .logo{font-size:26px;color:var(--text);}
  .no-chat-selected p{font-size:13.5px;max-width:280px;line-height:1.6;margin:0;}

  /* image lightbox */
  #lightbox{
    display:none;
    position:fixed;inset:0;
    background:rgba(10,10,16,0.85);
    align-items:center;justify-content:center;
    z-index:100;
    padding:24px;
  }
  #lightbox img{max-width:90vw;max-height:88vh;border-radius:6px;}

  /* mobile */
  @media (max-width:780px){
    .sidebar{
      width:100%;
      position:absolute;
      inset:0;
      z-index:5;
    }
    .sidebar.hide-mobile{display:none;}
    .chat-area{width:100%;}
    .chat-area.hide-mobile{display:none;}
    .app-shell{position:relative;}
    .back-btn{display:flex !important;}
  }
  .back-btn{display:none;}

  .toast{
    position:fixed;
    bottom:22px;left:50%;
    transform:translateX(-50%);
    background:var(--text);
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="auth-screen">
  <div class="auth-card" id="auth-card"></div>
</div>

<!-- ================= APP SCREEN ================= -->
<div id="app-screen">
  <div class="app-shell">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="me-row">
          <div class="avatar" id="me-avatar">?</div>
          <div>
            <div style="font-size:13.5px;font-weight:600;" id="me-name">—</div>
            <div style="font-size:11.5px;color:var(--text-muted);" id="me-mail">—</div>
          </div>
        </div>
        <button class="icon-btn" id="logout-btn" title="Выйти">⎋</button>
      </div>
      <div class="search-wrap">
        <div class="search-input-row">
          <input type="text" id="search-input" placeholder="Email или ник пользователя">
          <button class="search-btn" id="search-btn">Найти</button>
        </div>
        <div id="search-result-area"></div>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="no-chat-selected" id="no-chat-block">
        <div class="logo">Депеша</div>
        <p>Найдите собеседника по точному email или нику сверху, либо выберите чат из списка слева.</p>
      </div>

      <div id="active-chat-block" style="display:none;flex-direction:column;height:100%;">
        <div class="chat-header">
          <button class="icon-btn back-btn" id="back-btn">←</button>
          <div class="avatar" id="chat-avatar">?</div>
          <div>
            <div class="name" id="chat-header-name">—</div>
            <div class="sub" id="chat-header-sub">—</div>
          </div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="img-preview-row" id="img-preview-row"></div>
        <div class="composer">
          <button class="attach-btn" id="attach-btn" title="Прикрепить изображение">📎</button>
          <input type="file" id="file-input" accept="image/*" multiple style="display:none;">
          <textarea id="msg-input" rows="1" placeholder="Написать сообщение…"></textarea>
          <button class="send-btn" id="send-btn" title="Отправить">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="lightbox"><img id="lightbox-img" src=""></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ХРАНИЛИЩЕ
   Все данные (пользователи, чаты, сообщения) хранятся в
   ОБЩЕМ (shared) хранилище артефакта, чтобы разные люди,
   открывшие эту страницу, могли находить друг друга и
   переписываться. Это учебная демонстрация без настоящего
   сервера — не используйте для реальных приватных переписок.
============================================================ */

const state = {
  currentUser: null, // {email, username}
  view: 'login', // login | register | forgot
  chats: [],
  activeChatId: null,
  activeChatMeta: null,
  pendingImages: [], // [{dataUrl, name}]
  forgot: { step: 1, email: null, question: null },
  pollTimer: null,
  listTimer: null,
  lastMsgCount: 0,
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

async function sGet(key, shared){
  try{
    const r = await window.storage.get(key, !!shared);
    return r ? r.value : null;
  }catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{
    await window.storage.set(key, value, !!shared);
    return true;
  }catch(e){ return false; }
}
async function sList(prefix, shared){
  try{
    const r = await window.storage.list(prefix, !!shared);
    return r ? r.keys : [];
  }catch(e){ return []; }
}

async function sha256hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function normEmail(e){ return (e||'').trim().toLowerCase(); }
function normUser(u){ return (u||'').trim().toLowerCase(); }
function initials(name){
  return (name||'?').trim().slice(0,2).toUpperCase();
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ============================================================
   ВАЛИДАЦИЯ
============================================================ */
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function validUsername(u){ return /^[a-zA-Z0-9_]{3,20}$/.test(u); }

/* ============================================================
   РЕГИСТРАЦИЯ / ВХОД / ВОССТАНОВЛЕНИЕ
============================================================ */
async function doRegister(data){
  const email = normEmail(data.email);
  const username = normUser(data.username);
  if(!validEmail(email)) return {error:'Введите корректный email.'};
  if(!validUsername(username)) return {error:'Ник: 3–20 символов, латиница, цифры, "_".'};
  if(data.password.length < 6) return {error:'Пароль должен быть не короче 6 символов.'};
  if(data.password !== data.password2) return {error:'Пароли не совпадают.'};
  if(!data.question.trim() || !data.answer.trim()) return {error:'Заполните контрольный вопрос и ответ.'};

  const existingByMail = await sGet('users:'+email, true);
  if(existingByMail) return {error:'Пользователь с таким email уже зарегистрирован.'};
  const existingByUser = await sGet('usernameIndex:'+username, true);
  if(existingByUser) return {error:'Такой ник уже занят.'};

  const salt = randomSalt();
  const passwordHash = await sha256hex(salt+':'+data.password);
  const answerHash = await sha256hex(salt+':'+data.answer.trim().toLowerCase());

  const userRecord = {
    email, username, salt, passwordHash,
    question: data.question.trim(), answerHash,
    createdAt: Date.now()
  };
  const ok1 = await sSet('users:'+email, JSON.stringify(userRecord), true);
  const ok2 = await sSet('usernameIndex:'+username, email, true);
  if(!ok1 || !ok2) return {error:'Ошибка хранилища. Попробуйте ещё раз.'};
  return {ok:true, user:{email, username}};
}

async function doLogin(email, password){
  email = normEmail(email);
  const raw = await sGet('users:'+email, true);
  if(!raw) return {error:'Пользователь с таким email не найден.'};
  let rec;
  try{ rec = JSON.parse(raw); }catch(e){ return {error:'Ошибка данных пользователя.'}; }
  const hash = await sha256hex(rec.salt+':'+password);
  if(hash !== rec.passwordHash) return {error:'Неверный пароль.'};
  return {ok:true, user:{email:rec.email, username:rec.username}};
}

async function getRecoveryQuestion(email){
  email = normEmail(email);
  const raw = await sGet('users:'+email, true);
  if(!raw) return {error:'Пользователь с таким email не найден.'};
  const rec = JSON.parse(raw);
  return {ok:true, question: rec.question};
}

async function doResetPassword(email, answer, newPassword){
  email = normEmail(email);
  if(newPassword.length < 6) return {error:'Пароль должен быть не короче 6 символов.'};
  const raw = await sGet('users:'+email, true);
  if(!raw) return {error:'Пользователь не найден.'};
  const rec = JSON.parse(raw);
  const answerHash = await sha256hex(rec.salt+':'+answer.trim().toLowerCase());
  if(answerHash !== rec.answerHash) return {error:'Ответ на контрольный вопрос неверный.'};
  const newSalt = randomSalt();
  rec.salt = newSalt;
  rec.passwordHash = await sha256hex(newSalt+':'+newPassword);
  const ok = await sSet('users:'+email, JSON.stringify(rec), true);
  if(!ok) return {error:'Ошибка хранилища. Попробуйте ещё раз.'};
  return {ok:true};
}

async function findUser(query){
  const q = query.trim();
  if(!q) return {error:'Введите email или ник.'};
  let email = null;
  if(q.includes('@')){
    email = normEmail(q);
    const raw = await sGet('users:'+email, true);
    if(!raw) return {error:'Пользователь не найден.'};
    return {ok:true, user: JSON.parse(raw)};
  }else{
    const uname = normUser(q);
    const foundEmail = await sGet('usernameIndex:'+uname, true);
    if(!foundEmail) return {error:'Пользователь не найден.'};
    const raw = await sGet('users:'+foundEmail, true);
    if(!raw) return {error:'Пользователь не найден.'};
    return {ok:true, user: JSON.parse(raw)};
  }
}

/* ============================================================
   ЧАТЫ / СООБЩЕНИЯ
============================================================ */
function chatIdFor(a,b){
  return [normEmail(a), normEmail(b)].sort().join('__');
}

async function ensureChat(otherEmail, otherUsername){
  const me = state.currentUser;
  const id = chatIdFor(me.email, otherEmail);
  let raw = await sGet('chats:'+id, true);
  if(!raw){
    const meta = {
      id,
      participants: [me.email, normEmail(otherEmail)],
      usernames: { [me.email]: me.username, [normEmail(otherEmail)]: otherUsername },
      createdAt: Date.now(),
      lastMessage: '',
      lastType: 'text',
      lastTimestamp: Date.now(),
      lastFrom: ''
    };
    await sSet('chats:'+id, JSON.stringify(meta), true);
    raw = JSON.stringify(meta);
  }
  return JSON.parse(raw);
}

async function loadChatList(){
  const keys = await sList('chats:', true);
  const me = state.currentUser.email;
  const metas = [];
  for(const k of keys){
    const raw = await sGet(k, true);
    if(!raw) continue;
    try{
      const meta = JSON.parse(raw);
      if(meta.participants && meta.participants.includes(me)) metas.push(meta);
    }catch(e){}
  }
  metas.sort((a,b)=> (b.lastTimestamp||0) - (a.lastTimestamp||0));
  state.chats = metas;
  renderChatList();
}

async function loadMessages(chatId){
  const raw = await sGet('messages:'+chatId, true);
  if(!raw) return [];
  try{ return JSON.parse(raw); }catch(e){ return []; }
}

async function saveMessages(chatId, arr){
  return await sSet('messages:'+chatId, JSON.stringify(arr), true);
}

async function sendMessage(chatId, type, content, fileName){
  const msgs = await loadMessages(chatId);
  const msg = {
    id: Date.now()+'_'+Math.random().toString(36).slice(2,8),
    from: state.currentUser.email,
    type, content,
    fileName: fileName||null,
    timestamp: Date.now()
  };
  msgs.push(msg);
  await saveMessages(chatId, msgs);

  const raw = await sGet('chats:'+chatId, true);
  if(raw){
    const meta = JSON.parse(raw);
    meta.lastMessage = type === 'image' ? '📷 Изображение' : content.slice(0,80);
    meta.lastType = type;
    meta.lastTimestamp = msg.timestamp;
    meta.lastFrom = state.currentUser.email;
    await sSet('chats:'+chatId, JSON.stringify(meta), true);
  }
  return msg;
}

function showAuthMsg(text, isError){

/* ============================================================
   ВХОД В ПРИЛОЖЕНИЕ
============================================================ */
function loginSuccess(user){
  state.currentUser = user;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('me-avatar').textContent = initials(user.username);
  document.getElementById('me-name').textContent = user.username;
  document.getElementById('me-mail').textContent = user.email;
  loadChatList();
  startPolling();
}

function logout(){
  state.currentUser = null;
  state.activeChatId = null;
  state.activeChatMeta = null;
  stopPolling();
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  state.view = 'login';
  renderAuth();
}

/* ============================================================
   ПОИСК ПОЛЬЗОВАТЕЛЕЙ
============================================================ */
async function onSearch(){
  const q = document.getElementById('search-input').value;
  const area = document.getElementById('search-result-area');
  area.innerHTML = `<div class="search-note">Ищем…</div>`;
  const res = await findUser(q);
  if(res.error){
    area.innerHTML = `<div class="search-note">${escapeHtml(res.error)}</div>`;
    return;
  }
  const u = res.user;
  if(u.email === state.currentUser.email){
    area.innerHTML = `<div class="search-note">Это ваш собственный аккаунт.</div>`;
    return;
  }
  area.innerHTML = `
    <div class="search-result">
      <div class="avatar">${initials(u.username)}</div>
      <div class="info">
        <div class="name">${escapeHtml(u.username)}</div>
        <div class="mail">${escapeHtml(u.email)}</div>
      </div>
      <button class="mini-btn" id="start-chat-btn">Написать</button>
    </div>
  `;
  document.getElementById('start-chat-btn').onclick = async ()=>{
    const meta = await ensureChat(u.email, u.username);
    document.getElementById('search-input').value = '';
    area.innerHTML = '';
    await loadChatList();
    openChat(meta.id);
  };
}

/* ============================================================
   РЕНДЕР: СПИСОК ЧАТОВ
============================================================ */
function fmtTime(ts){
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if(sameDay) return d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'});
}

function otherOf(meta){
  const me = state.currentUser.email;
  const otherEmail = meta.participants.find(p=>p!==me) || me;
  const otherUsername = (meta.usernames && meta.usernames[otherEmail]) || otherEmail;
  return {email: otherEmail, username: otherUsername};
}

function renderChatList(){
  const list = document.getElementById('chat-list');
  if(!state.chats.length){
    list.innerHTML = `<div class="empty-list">Пока нет ни одного чата.<br>Найдите пользователя по точному email или нику выше.</div>`;
    return;
  }
  list.innerHTML = state.chats.map(meta=>{
    const other = otherOf(meta);
    const active = meta.id === state.activeChatId ? 'active' : '';
    const preview = meta.lastMessage ? escapeHtml(meta.lastMessage) : 'Нет сообщений';
    return `
      <div class="chat-item ${active}" data-id="${meta.id}">
        <div class="avatar">${initials(other.username)}</div>
        <div class="info">
          <div class="top-row">
            <div class="name">${escapeHtml(other.username)}</div>
            <div class="time">${meta.lastTimestamp ? fmtTime(meta.lastTimestamp) : ''}</div>
          </div>
          <div class="preview">${preview}</div>
        </div>
      </div>
    `;
  }).join('');
  list.querySelectorAll('.chat-item').forEach(el=>{
    el.onclick = ()=> openChat(el.getAttribute('data-id'));
  });
}

/* ============================================================
   ОТКРЫТИЕ ЧАТА / СООБЩЕНИЯ
============================================================ */
async function openChat(chatId){
  state.activeChatId = chatId;
  const raw = await sGet('chats:'+chatId, true);
  if(!raw) return;
  state.activeChatMeta = JSON.parse(raw);
  const other = otherOf(state.activeChatMeta);

  document.getElementById('no-chat-block').style.display = 'none';
  document.getElementById('active-chat-block').style.display = 'flex';
  document.getElementById('chat-avatar').textContent = initials(other.username);
  document.getElementById('chat-header-name').textContent = other.username;
  document.getElementById('chat-header-sub').textContent = other.email;

  if(window.innerWidth <= 780){
    document.getElementById('sidebar').classList.add('hide-mobile');
    document.getElementById('chat-area').classList.remove('hide-mobile');
  }

  renderChatList();
  await refreshMessages(true);
}

async function refreshMessages(forceScroll){
  if(!state.activeChatId) return;
  const msgs = await loadMessages(state.activeChatId);
  if(msgs.length === state.lastMsgCount && !forceScroll) return;
  state.lastMsgCount = msgs.length;

  const box = document.getElementById('messages');
  let lastDay = null;
  let html = '';
  for(const m of msgs){
    const d = new Date(m.timestamp);
    const dayLabel = d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
    if(dayLabel !== lastDay){
      html += `<div class="day-divider">${dayLabel}</div>`;
      lastDay = dayLabel;
    }
    const out = m.from === state.currentUser.email;
    const time = d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    if(m.type === 'image'){
      html += `<div class="msg-row ${out?'out':'in'}"><div class="bubble"><img src="${m.content}" data-full="${m.content}" class="msg-img"><span class="time">${time}</span></div></div>`;
    }else{
      html += `<div class="msg-row ${out?'out':'in'}"><div class="bubble">${escapeHtml(m.content).replace(/\n/g,'<br>')}<span class="time">${time}</span></div></div>`;
    }
  }
  box.innerHTML = html || `<div class="empty-list">Сообщений пока нет. Напишите первое!</div>`;
  box.querySelectorAll('.msg-img').forEach(img=>{
    img.onclick = ()=>{
      document.getElementById('lightbox-img').src = img.getAttribute('data-full');
      document.getElementById('lightbox').style.display = 'flex';
    };
  });
  box.scrollTop = box.scrollHeight;
}

/* ============================================================
   ОТПРАВКА СООБЩЕНИЙ / ИЗОБРАЖЕНИЙ
============================================================ */
function resizeImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 900;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else{ w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderImgPreviews(){
  const row = document.getElementById('img-preview-row');
  row.innerHTML = state.pendingImages.map((im, idx)=>`
    <div class="img-preview">
      <img src="${im.dataUrl}">
      <div class="rm" data-idx="${idx}">✕</div>
    </div>
  `).join('');
  row.querySelectorAll('.rm').forEach(el=>{
    el.onclick = ()=>{
      state.pendingImages.splice(parseInt(el.getAttribute('data-idx')), 1);
      renderImgPreviews();
    };
  });
}

async function doSend(){
  if(!state.activeChatId) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  const images = state.pendingImages.slice();
  if(!text && images.length === 0) return;

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;

  if(text){
    await sendMessage(state.activeChatId, 'text', text);
  }
  for(const im of images){
    await sendMessage(state.activeChatId, 'image', im.dataUrl, im.name);
  }
  input.value = '';
  input.style.height = 'auto';
  state.pendingImages = [];
  renderImgPreviews();
  sendBtn.disabled = false;
  await refreshMessages(true);
  await loadChatList();
}

/* ============================================================
   ОПРОС (имитация «живых» обновлений без backend)
============================================================ */
function startPolling(){
  stopPolling();
  state.pollTimer = setInterval(()=>{ if(state.activeChatId) refreshMessages(false); }, 3000);
  state.listTimer = setInterval(()=>{ if(state.currentUser) loadChatList(); }, 6000);
}
function stopPolling(){
  if(state.pollTimer) clearInterval(state.pollTimer);
  if(state.listTimer) clearInterval(state.listTimer);
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ СОБЫТИЙ
============================================================ */
document.getElementById('search-btn').onclick = onSearch;
document.getElementById('search-input').addEventListener('keydown', e=>{ if(e.key==='Enter') onSearch(); });
document.getElementById('logout-btn').onclick = logout;

document.getElementById('attach-btn').onclick = ()=> document.getElementById('file-input').click();
document.getElementById('file-input').addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files || []);
  for(const f of files){
    try{
      const dataUrl = await resizeImageFile(f);
      state.pendingImages.push({dataUrl, name: f.name});
    }catch(err){ toast('Не удалось загрузить изображение'); }
  }
  renderImgPreviews();
  e.target.value = '';
});

document.getElementById('send-btn').onclick = doSend;
const msgInput = document.getElementById('msg-input');
msgInput.addEventListener('input', ()=>{
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120)+'px';
});
msgInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    doSend();
  }
});

document.getElementById('back-btn').onclick = ()=>{
  document.getElementById('sidebar').classList.remove('hide-mobile');
  document.getElementById('chat-area').classList.add('hide-mobile');
};

document.getElementById('lightbox').addEventListener('click', ()=>{
  document.getElementById('lightbox').style.display = 'none';
});

renderAuth();
</script>
